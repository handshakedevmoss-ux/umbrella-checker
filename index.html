  <style>
    :root {
      --bg-grad-1: #1a1e2e;
      --bg-grad-2: #242436;
      --bg-grad-3: #0e121a;
      --accent-glow: rgba(99, 102, 241, 0.16);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-focus: rgba(255, 255, 255, 0.22);
    }

    body {
      background-color: var(--bg-grad-3);
      min-height: 100vh;
      color: #f1f5f9;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      transition: background-color 1.2s ease;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Ambient dynamic background lighting */
    .ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.55;
      transition: all 1.8s cubic-bezier(0.4, 0, 0.2, 1);
      animation: floatMotion 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      top: -100px;
      left: 10%;
      background: var(--bg-grad-1);
    }

    .orb-2 {
      width: 440px;
      height: 440px;
      top: 30%;
      right: -50px;
      background: var(--bg-grad-2);
      animation-delay: -5s;
    }

    .orb-3 {
      width: 520px;
      height: 520px;
      bottom: -150px;
      left: 20%;
      background: var(--accent-glow);
      animation-delay: -9s;
    }

    @keyframes floatMotion {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, 30px) scale(1.05); }
      100% { transform: translate(-25px, -15px) scale(0.96); }
    }

    /* Glassmorphism containers */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 36px 0 rgba(0, 0, 0, 0.4),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.08);
    }

    .glass-input {
      background: rgba(15, 20, 32, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
      outline: none;
      transition: all 0.2s ease;
    }

    .glass-input:focus {
      border-color: var(--glass-border-focus);
      background: rgba(20, 26, 42, 0.65);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.08);
    }

    .glass-input option {
      background-color: #161a26;
      color: #f1f5f9;
    }

    /* Umbrella icon floating pulse */
    .umbrella-float {
      animation: gentleBob 4s ease-in-out infinite;
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(-1deg); }
    }

    /* Subtle Chic Drop Shadow */
    .icon-chic {
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
    }
  </style>
</head>

        </svg>
      `;
    }

    function getSunSVG(size = 86) {
      return `
        <svg class="icon-chic" width="${size}" height="${size}" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="chic-sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fde047" />
              <stop offset="100%" stop-color="#f59e0b" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="22" fill="url(#chic-sun-grad)" filter="drop-shadow(0 2px 8px rgba(245, 158, 11, 0.35))"/>
          <g stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
            <line x1="50" y1="14" x2="50" y2="21" />
            <line x1="50" y1="79" x2="50" y2="86" />
            <line x1="14" y1="50" x2="21" y2="50" />
            <line x1="79" y1="50" x2="86" y2="50" />
            <line x1="24" y1="24" x2="29" y2="29" />
            <line x1="71" y1="71" x2="76" y2="76" />
            <line x1="24" y1="76" x2="29" y2="71" />
            <line x1="71" y1="29" x2="76" y2="24" />
          </g>
        </svg>
      `;
    }

    function getWeatherIcon(code, isDay = true, size = 32) {
      const uid = Math.random().toString(36).substring(2, 7);
      const defs = `
        <defs>
          <linearGradient id="sun-${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fde68a" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>
          <!-- Muted natural cloud gradient without artificial glow -->
          <linearGradient id="cloud-${uid}" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#94a3b8" />
            <stop offset="100%" stop-color="#64748b" />
          </linearGradient>
          <linearGradient id="raincloud-${uid}" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#64748b" />
            <stop offset="100%" stop-color="#475569" />
          </linearGradient>
          <linearGradient id="rain-drop-${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#94a3b8" />
            <stop offset="100%" stop-color="#64748b" />
          </linearGradient>
        </defs>
      `;

      // Clear (0, 1) - Sunny / Bright
      if (code === 0 || code === 1) {
        if (!isDay) {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
            </svg>
          `;
        }
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">
            ${defs}
            <circle cx="12" cy="12" r="5" fill="url(#sun-${uid})"/>
            <g stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round">
              <line x1="12" y1="2" x2="12" y2="4.5"/>
              <line x1="12" y1="19.5" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="4.5" y2="12"/>
              <line x1="19.5" y1="12" x2="22" y2="12"/>
              <line x1="5" y1="5" x2="6.8" y2="6.8"/>
              <line x1="17.2" y1="17.2" x2="19" y2="19"/>
              <line x1="5" y1="19" x2="6.8" y2="17.2"/>
              <line x1="17.2" y1="6.8" x2="19" y2="5"/>
            </g>
          </svg>
        `;
      } 
      // Partly cloudy (2, 3) - Sun peeking behind natural cloud
      else if (code === 2 || code === 3) {
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">
            ${defs}
            <circle cx="15.5" cy="8.5" r="3.5" fill="url(#sun-${uid})"/>
            <path d="M17.5 18H7a4 4 0 0 1-.8-7.92 5 5 0 0 1 9.6-1.38A3.5 3.5 0 0 1 17.5 18Z" 
                  fill="url(#cloud-${uid})" 
                  stroke="rgba(255,255,255,0.15)" 
                  stroke-width="0.8"/>
          </svg>
        `;
      } 
      // Rain / Showers (51-67, 80-82) - Matches the umbrella icon colorway
      else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">
            ${defs}
            <path d="M19 11.5 C19 8.2 16.2 6 12 6 C7.8 6 5 8.2 5 11.5 C4 11.5 3 12.2 3 13.5 C3 14.8 4.2 15.5 5.5 15.5 C6.5 15 7.5 15 8.5 15 C9.5 15 10.5 14.2 12 14.2 C13.5 14.2 14.5 15 15.5 15 C16.5 15 17.5 15 18.5 15.5 C19.8 15.5 21 14.8 21 13.5 C21 12.2 20 11.5 19 11.5 Z" 
                  fill="url(#raincloud-${uid})"/>
            <path d="M12 14 L12 19 C12 20.2 11 21 9.8 21 C8.6 21 8 20.2 8.2 19" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <line x1="6" y1="3" x2="6.5" y2="4.5" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="12" y1="2" x2="12" y2="3.8" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="18" y1="3" x2="17.5" y2="4.5" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        `;
      } 
      // Snow (71-77, 85, 86)
      else if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4L18.4 5.6"/>
            <circle cx="12" cy="12" r="1.5" fill="#cbd5e1"/>
          </svg>
        `;
      } 
      // Thunderstorm (>= 95)
      else if (code >= 95) {
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">
            ${defs}
            <path d="M17 13H7a3.5 3.5 0 0 1-.7-6.93 4.5 4.5 0 0 1 8.6-1.15A3 3 0 0 1 17 13Z" fill="url(#raincloud-${uid})"/>
            <polygon points="12 13 9 17.5 12.5 17.5 11 22 15.5 16 12.5 16 13.5 13" fill="#f59e0b"/>
          </svg>
        `;
      } 
      // Overcast / Fog - Muted natural tone
      else {
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">
            ${defs}
            <path d="M17.5 17H7a4.5 4.5 0 0 1-.8-8.93 5.5 5.5 0 0 1 10.6-1.57A4 4 0 0 1 17.5 17Z" fill="url(#cloud-${uid})" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
          </svg>
        `;
      }
    }

    function getWeatherDescription(code) {
      if (code === 0) return "快晴";
      if (code === 1) return "晴れ";
      if (code === 2) return "時々曇り";
      if (code === 3) return "曇り";
      if (code === 45 || code === 48) return "霧";
      if (code >= 51 && code <= 55) return "小雨・霧雨";
      if (code >= 61 && code <= 65) return "雨";
      if (code >= 66 && code <= 67) return "強い雨";
      if (code >= 71 && code <= 77) return "雪";
      if (code >= 80 && code <= 82) return "にわか雨";
      if (code >= 95) return "雷雨";
      return "曇りがち";
    }

    function setAmbientTheme(status) {
      const root = document.documentElement;
      const cardGlow = document.getElementById('cardGlow');

      if (status === 'rain') {
        root.style.setProperty('--bg-grad-1', '#181e2b');
        root.style.setProperty('--bg-grad-2', '#212634');
        root.style.setProperty('--bg-grad-3', '#0d1117');
        root.style.setProperty('--accent-glow', 'rgba(100, 116, 139, 0.18)');
        if (cardGlow) cardGlow.className = "absolute w-48 h-48 rounded-full bg-slate-600/15 blur-3xl pointer-events-none -top-10 -right-10";
      } else if (status === 'cloudy') {
        root.style.setProperty('--bg-grad-1', '#1a202c');
        root.style.setProperty('--bg-grad-2', '#222836');
        root.style.setProperty('--bg-grad-3', '#0e1219');
        root.style.setProperty('--accent-glow', 'rgba(148, 163, 184, 0.16)');
        if (cardGlow) cardGlow.className = "absolute w-48 h-48 rounded-full bg-slate-500/15 blur-3xl pointer-events-none -top-10 -right-10";
      } else {
        root.style.setProperty('--bg-grad-1', '#1a2233');
        root.style.setProperty('--bg-grad-2', '#272a38');
        root.style.setProperty('--bg-grad-3', '#0d1118');
        root.style.setProperty('--accent-glow', 'rgba(245, 158, 11, 0.12)');
        if (cardGlow) cardGlow.className = "absolute w-48 h-48 rounded-full bg-amber-500/10 blur-3xl pointer-events-none -top-10 -right-10";
      }
    }

    // UI Elements
    const prefSelect = document.getElementById('prefSelect');
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchMsg = document.getElementById('searchMsg');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');

    // Populate Prefectures dropdown
    PREFECTURES.forEach(pref => {
      const option = document.createElement('option');
      option.value = pref.name;
      option.textContent = pref.name;
      if (pref.name === "東京都") option.selected = true;
      prefSelect.appendChild(option);
    });

    prefSelect.addEventListener('change', () => {
      const selected = PREFECTURES.find(p => p.name === prefSelect.value);
      if (selected && !cityInput.value.trim()) {
        cityInput.value = selected.city;
      }
    });

    // Resolve Geocoding
    async function resolveCoordinates(prefName, cityName) {
      const query = `${prefName} ${cityName}`.trim();
      
      try {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=ja&format=json`;
        const res = await fetch(geoUrl);
        if (res.ok) {
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            const match = data.results.find(r => r.country_code === "JP" || r.country === "Japan") || data.results[0];
            return {
              lat: match.latitude,
              lon: match.longitude,
              resolvedName: `${prefName} ${cityName}`
            };
          }
        }
      } catch (err) {
        console.warn("Geocoding failed, falling back to capital coordinates.", err);
      }

      const fallback = PREFECTURES.find(p => p.name === prefName) || PREFECTURES[12];
      return {
        lat: fallback.lat,
        lon: fallback.lon,
        resolvedName: `${prefName} ${cityName || fallback.city}`
      };
    }

    // Fetch Weather Forecast
    async function fetchWeatherData(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=3`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("天気情報の取得に失敗しました");
      return await response.json();
    }

    // Render Weather Data
    function renderWeather(data, locationName) {
      const locEl = document.getElementById('locationLabel');
      if (locEl) locEl.textContent = locationName;

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
      const currentDate = String(now.getDate()).padStart(2, '0');
      const currentHour = now.getHours();
      const targetTimeStr = `${currentYear}-${currentMonth}-${currentDate}T${String(currentHour).padStart(2, '0')}:00`;

      const hourly = data.hourly || {};
      const timeArr = hourly.time || [];
      let startIndex = timeArr.indexOf(targetTimeStr);
      if (startIndex === -1) {
        startIndex = Math.max(0, Math.min(currentHour, timeArr.length - 6));
      }

      const next6Hours = [];
      let maxProb = 0;

      for (let i = 0; i < 6; i++) {
        const idx = startIndex + i;
        if (idx < timeArr.length) {
          const timeStr = timeArr[idx];
          const hour = parseInt(timeStr.split('T')[1].split(':')[0], 10);
          const prob = hourly.precipitation_probability ? (hourly.precipitation_probability[idx] ?? 0) : 0;
          const code = hourly.weather_code ? (hourly.weather_code[idx] ?? 0) : 0;
          const temp = hourly.temperature_2m ? Math.round(hourly.temperature_2m[idx]) : 0;

          if (prob > maxProb) maxProb = prob;

          next6Hours.push({
            hour: `${String(hour).padStart(2, '0')}:00`,
            prob,
            code,
            temp,
            isDay: hour >= 6 && hour < 18
          });
        }
      }

      const heroIconContainer = document.getElementById('heroIconContainer');
      const verdictTitle = document.getElementById('verdictTitle');
      const verdictProb = document.getElementById('verdictProb');
      const verdictNote = document.getElementById('verdictNote');

      if (verdictProb) verdictProb.textContent = `${maxProb}%`;

      if (maxProb >= 50) {
        if (verdictTitle) {
          verdictTitle.textContent = "傘を持っていくべき！";
          verdictTitle.className = "text-2xl sm:text-3xl font-black text-white tracking-wide mt-2 drop-shadow";
        }
        if (verdictNote) verdictNote.textContent = "（雨具の用意を）";
        if (heroIconContainer) heroIconContainer.innerHTML = getUmbrellaSVG(92);
        setAmbientTheme('rain');
      } else if (maxProb >= 20) {
        if (verdictTitle) {
          verdictTitle.textContent = "折りたたみ傘があると安心！";
          verdictTitle.className = "text-2xl sm:text-3xl font-black text-white tracking-wide mt-2 drop-shadow";
        }
        if (verdictNote) verdictNote.textContent = "（念のため携帯推奨）";
        if (heroIconContainer) heroIconContainer.innerHTML = getFoldableUmbrellaSVG(88);
        setAmbientTheme('cloudy');
      } else {
        if (verdictTitle) {
          verdictTitle.textContent = "傘はいりません！";
          verdictTitle.className = "text-2xl sm:text-3xl font-black text-white tracking-wide mt-2 drop-shadow";
        }
        if (verdictNote) verdictNote.textContent = "（安心してお出かけ）";
        if (heroIconContainer) heroIconContainer.innerHTML = getSunSVG(86);
        setAmbientTheme('sunny');
      }

      // Update Timeline Range Label
      const timeRangeEl = document.getElementById('currentTimeRange');
      if (timeRangeEl && next6Hours.length >= 2) {
        timeRangeEl.textContent = `${next6Hours[0].hour} 〜 ${next6Hours[next6Hours.length - 1].hour}`;
      }

      // Render 6-hour Cards
      const hourlyTimeline = document.getElementById('hourlyTimeline');
      if (hourlyTimeline) {
        hourlyTimeline.innerHTML = '';
        next6Hours.forEach(item => {
          const col = document.createElement('div');
          col.className = "flex flex-col items-center bg-white/[0.03] hover:bg-white/[0.07] rounded-xl p-2 sm:p-2.5 transition-all border border-white/[0.05]";

          const barHeight = Math.max(4, Math.min(100, item.prob));
          let barColor = "bg-slate-500";
          if (item.prob >= 50) barColor = "bg-slate-400";
          else if (item.prob >= 20) barColor = "bg-slate-500";

          col.innerHTML = `
            <span class="text-[11px] sm:text-xs font-semibold text-slate-400">${item.hour}</span>
            <div class="my-2 h-7 w-7 flex items-center justify-center">
              ${getWeatherIcon(item.code, item.isDay, 28)}
            </div>
            <span class="text-xs sm:text-sm font-bold text-white mb-1.5">${item.temp}℃</span>
            <div class="w-full bg-slate-800/80 h-1 rounded-full overflow-hidden mb-1">
              <div class="${barColor} h-full rounded-full" style="width: ${barHeight}%"></div>
            </div>
            <span class="text-[10px] font-bold ${item.prob >= 50 ? 'text-slate-200' : 'text-slate-400'}">${item.prob}%</span>
          `;
          hourlyTimeline.appendChild(col);
        });
      }

      // Render Tomorrow Forecast
      const daily = data.daily;
      if (daily && daily.time && daily.time.length >= 2) {
        const tomorrowIndex = 1;
        const tDateStr = daily.time[tomorrowIndex];
        const [, m, d] = tDateStr.split('-');
        
        const dateEl = document.getElementById('tomorrowDate');
        if (dateEl) dateEl.textContent = `明日 (${parseInt(m, 10)}月${parseInt(d, 10)}日)`;

        const tCode = daily.weather_code ? daily.weather_code[tomorrowIndex] : 0;
        const tSummary = getWeatherDescription(tCode);
        const tMax = daily.temperature_2m_max ? Math.round(daily.temperature_2m_max[tomorrowIndex]) : 0;
        const tMin = daily.temperature_2m_min ? Math.round(daily.temperature_2m_min[tomorrowIndex]) : 0;
        const tProb = daily.precipitation_probability_max ? (daily.precipitation_probability_max[tomorrowIndex] ?? 0) : 0;

        const sumEl = document.getElementById('tomorrowSummary');
        const iconEl = document.getElementById('tomorrowIcon');
        const maxEl = document.getElementById('tomorrowMaxTemp');
        const minEl = document.getElementById('tomorrowMinTemp');
        const probEl = document.getElementById('tomorrowProb');

        if (sumEl) sumEl.textContent = tSummary;
        if (iconEl) iconEl.innerHTML = getWeatherIcon(tCode, true, 36);
        if (maxEl) maxEl.textContent = `${tMax}℃`;
        if (minEl) minEl.textContent = `${tMin}℃`;
        if (probEl) probEl.textContent = `${tProb}%`;
      }
    }

    // Execute Search
    async function handleSearch() {
      const prefName = prefSelect.value;
      const cityName = cityInput.value.trim().replace(/[<>]/g, ""); // Basic sanitize

      if (!cityName) {
        searchMsg.textContent = "市区町村名を入力してください（例: 新宿区）";
        searchMsg.classList.remove('hidden');
        cityInput.focus();
        return;
      }

      searchMsg.classList.add('hidden');
      searchBtn.disabled = true;
      btnText.textContent = "取得中...";
      btnIcon.classList.add("animate-spin");

      try {
        const location = await resolveCoordinates(prefName, cityName);
        const weatherData = await fetchWeatherData(location.lat, location.lon);
        renderWeather(weatherData, location.resolvedName);
      } catch (err) {
        console.error(err);
        searchMsg.textContent = "天気データの取得に失敗しました。時間をおいてお試しください。";
        searchMsg.classList.remove('hidden');
      } finally {
        searchBtn.disabled = false;
        btnText.textContent = "天気を調べる";
        btnIcon.classList.remove("animate-spin");
      }
    }

    // Event Bindings
    searchBtn.addEventListener('click', handleSearch);
    cityInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    // Auto-run for Tokyo on load
    window.addEventListener('DOMContentLoaded', () => {
      handleSearch();
    });
  </script>
</body>
</html>
